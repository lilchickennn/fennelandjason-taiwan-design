<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fennel & Jason's 台灣設計展隨身觀展手冊</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', '"Noto Sans TC"', 'sans-serif'] },
          colors: { 
            brand: { 50: '#ecfdf5', 100: '#d1fae5', 400: '#34d399', 500: '#10b981', 600: '#059669', 900: '#064e3b' },
            // 定義官方專屬色系
            zoneA: '#e11d48', // 官方洋紅色 (Rose-600)
            zoneB: '#2563eb', // 官方藍色 (Blue-600)
            zoneC: '#fb7185', // 官方淺桃色 (Rose-400)
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; user-select: text; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    
    @keyframes pinkGlow { 0% { box-shadow: 0 0 5px rgba(244, 114, 182, 0.5); } 50% { box-shadow: 0 0 20px rgba(244, 114, 182, 0.8), 0 0 10px rgba(244, 114, 182, 0.4) inset; } 100% { box-shadow: 0 0 5px rgba(244, 114, 182, 0.5); } }
    .surprise-card { border: 2px solid #f472b6 !important; animation: pinkGlow 2s infinite; background: linear-gradient(to right, #ffffff, #fff0f6); }
    
    input[type="file"] { display: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col font-sans pb-12">

  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200/80 transition-all">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 via-teal-500 to-cyan-500 flex items-center justify-center text-white shadow-md">
          <i class="ph-bold ph-compass text-xl"></i>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <span class="text-[10px] font-bold uppercase tracking-widest text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">TAIWAN DESIGN EXPO</span>
          </div>
          <h1 class="text-sm font-extrabold text-slate-900 tracking-tight leading-tight mt-0.5">🧍‍♂️♥️🧍‍♀️ Fennel & Jason's 設計展觀展集章</h1>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="exportModalBtn" class="flex items-center gap-1 px-3 py-1.5 bg-slate-900 text-white rounded-xl text-xs font-semibold shadow-sm transition active:scale-95">
          <i class="ph-bold ph-images text-sm"></i> <span>回憶錄</span>
        </button>
      </div>
    </div>

    <div class="max-w-3xl mx-auto px-4 pb-2.5 pt-1">
      <div class="flex items-center justify-between text-xs font-semibold text-slate-600 mb-1.5">
        <div class="flex items-center gap-1.5">
          <i class="ph-fill ph-check-circle text-emerald-500 text-sm"></i>
          <span>已攻略：<strong id="progressCount" class="text-slate-900 text-sm font-bold">0</strong> / <span id="totalCount">21</span> 區</span>
        </div>
        <div class="font-mono text-emerald-600 font-bold" id="progressPercent">0%</div>
      </div>
      <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden p-0.5 shadow-inner">
        <div id="progressBar" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-full rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-4 space-y-4">
    <section class="space-y-2.5 bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-2xs">
      <div class="flex items-center gap-1.5 overflow-x-auto custom-scrollbar pb-1 text-xs whitespace-nowrap">
        <button class="filter-tab px-3 py-1.5 rounded-xl font-semibold transition active:scale-95 bg-slate-900 text-white" data-filter="all">全部 (<span id="pillAllCount">0</span>)</button>
        <button class="filter-tab px-3 py-1.5 rounded-xl font-semibold bg-slate-100 text-slate-600 transition active:scale-95" data-filter="visited">已踩點 🏁</button>
        <button class="filter-tab px-3 py-1.5 rounded-xl font-semibold bg-slate-100 text-slate-600 transition active:scale-95" data-filter="pending">待攻略 🧭</button>
      </div>
    </section>

    <!-- 展區列表容器 -->
    <div id="exhibitionList" class="space-y-3.5"></div>
    <div id="emptyState" class="hidden py-14 text-center"><h3 class="text-sm font-bold text-slate-400">找不到展區</h3></div>

    <div class="py-6 text-center text-xs text-slate-400">
      <button id="resetAllDataBtn" class="hover:text-rose-600 underline underline-offset-4 transition">
        活動結束：清除所有打卡與本機照片紀錄
      </button>
    </div>
  </main>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 transform translate-y-3 flex items-center gap-2 bg-slate-900/90 backdrop-blur-md text-white px-4 py-2.5 rounded-2xl shadow-xl text-xs font-semibold">
    <i class="ph-bold ph-check text-emerald-400"></i><span id="toastMsg">已自動儲存</span>
  </div>

  <!-- C1 驚喜解鎖 Modal -->
  <div id="surpriseModal" class="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 hidden transition-opacity">
    <div class="bg-white/95 w-full max-w-sm rounded-3xl p-6 text-center shadow-2xl border-4 border-pink-100 relative overflow-hidden">
      <div class="absolute -top-10 -right-10 w-32 h-32 bg-pink-200 rounded-full mix-blend-multiply filter blur-2xl opacity-50"></div>
      <div class="text-6xl mb-4 animate-bounce relative z-10">🎇</div>
      <h3 class="text-2xl font-extrabold text-pink-500 mb-2 relative z-10">Surprise! 叮咚！</h3>
      <p class="text-slate-600 mb-6 font-medium leading-relaxed relative z-10 text-sm">
        HiHi！有一個特別展區已經解鎖囉！<br>我們一起去看看吧！
      </p>
      <button onclick="closeSurprise()" class="w-full bg-gradient-to-r from-pink-400 to-rose-400 text-white rounded-xl py-3 font-bold text-base active:scale-95 transition shadow-lg relative z-10">
        去看看 ✨
      </button>
    </div>
  </div>

  <!-- 圖文回憶錄 Export Modal -->
  <div id="exportModal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 hidden transition-opacity">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden relative">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2"><i class="ph-bold ph-images text-emerald-600"></i> 圖文回憶錄預覽</h3>
        <button id="closeExportModal" class="text-slate-400"><i class="ph-bold ph-x text-lg"></i></button>
      </div>
      
      <div class="p-0 overflow-y-auto bg-slate-200 flex-1 relative">
        <div id="visualReport" class="w-full">
          <!-- 內容由 JS 自動產生 -->
        </div>
        <div id="captureLoading" class="absolute inset-0 bg-white/90 flex flex-col items-center justify-center hidden z-10">
          <i class="ph-bold ph-spinner-gap text-4xl text-emerald-500 animate-spin mb-2"></i>
          <span class="text-emerald-700 font-bold text-sm">正在產生高畫質長圖...</span>
        </div>
      </div>

      <div class="p-4 border-t border-slate-100 bg-white flex gap-2">
        <button id="downloadVisualReportBtn" class="flex-1 py-3 bg-emerald-600 text-white font-bold rounded-xl flex items-center justify-center gap-1.5 transition text-sm shadow-md active:scale-95">
          <i class="ph-bold ph-download-simple"></i> 產生精美長圖 (存入相簿)
        </button>
        <button id="closeExportModalBtn2" class="px-4 py-3 bg-slate-100 text-slate-700 font-semibold rounded-xl text-sm">關閉</button>
      </div>
    </div>
  </div>

  <!-- 長圖產出後的展示 Modal -->
  <div id="finalImageModal" class="fixed inset-0 z-[60] bg-black/95 flex flex-col items-center justify-center p-4 hidden">
    <p class="text-emerald-400 mb-4 text-sm font-bold flex items-center gap-2 animate-bounce">
      <i class="ph-fill ph-check-circle text-lg"></i> 產生成功！請長按圖片選擇「儲存影像」
    </p>
    <div class="overflow-y-auto max-h-[75vh] w-full max-w-sm rounded-lg shadow-2xl ring-1 ring-white/20">
      <img id="finalGeneratedImage" src="" class="w-full h-auto block rounded-lg">
    </div>
    <button onclick="document.getElementById('finalImageModal').classList.add('hidden')" class="mt-6 px-8 py-2.5 bg-white/20 hover:bg-white/30 text-white rounded-full font-bold text-sm backdrop-blur-md">
      完成關閉
    </button>
  </div>

  <!-- Confirm Reset Modal -->
  <div id="confirmModal" class="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-xs rounded-2xl p-5 shadow-2xl text-center">
      <h4 class="font-bold text-sm mb-2">確定清空所有紀錄與照片？</h4>
      <div class="flex gap-2 pt-2">
        <button id="confirmResetBtn" class="flex-1 py-2 bg-rose-600 text-white font-bold rounded-xl text-xs">確定清空</button>
        <button id="cancelResetBtn" class="flex-1 py-2 bg-slate-100 rounded-xl text-xs">取消</button>
      </div>
    </div>
  </div>

  <script>
    const BASE_EXHIBITIONS = [
      { id: 'A1', code: 'A1', name: '桃園流', desc: '桃園是一座由人集結而成的匯流之城，不僅是地理的入口，更是情感的觸點。', visited: false, rating: 0, notes: '', tags: ['行動流'] },
      { id: 'A2', code: 'A2', name: '城市脈搏·跳動未來', desc: '化身 2040 未來城市設計師，透過沉浸式劇場、互動探索與城市共創，感受設計如何改變城市。', visited: false, rating: 0, notes: '', tags: ['願景流'] },
      { id: 'A3', code: 'A3', name: '匯流之橋', desc: '以「匯流」為核心精神，以「彩色玻璃橋」結合「數位媒材」作為展演形式。', visited: false, rating: 0, notes: '', tags: ['玩美流'] },
      { id: 'A4', code: 'A4', name: '日常動力學', desc: '以企業發展的動能為核心，拆解日常這場複雜細膩的動力學。', visited: false, rating: 0, notes: '', tags: ['跨界流'] },
      { id: 'A5', code: 'A5', name: '產業新態', desc: '展現產業不斷進化的過程，陪著企業重新盤點需求、串聯資源。', visited: false, rating: 0, notes: '', tags: ['價值流'] },
      { id: 'A6', code: 'A6', name: '桃○計畫-未來循環園', desc: '串聯在地產業、設計創新與循環實踐，描繪持續生成的未來想像。', visited: false, rating: 0, notes: '', tags: ['永續流'] },
      { id: 'A7', code: 'A7', name: '好市有戲', desc: '走進台灣代表性商圈與市場，看見設計驅動商圈脈動，串連人、場域與服務。', visited: false, rating: 0, notes: '', tags: ['賣動流'] },
      { id: 'A8', code: 'A8', name: '24HR 運轉全世界', desc: '盤點製造產業四大系統與七大產業面向，展現桃園成為全球供應鏈樞紐。', visited: false, rating: 0, notes: '', tags: ['智造流'] },
      { id: 'A9', code: 'A9', name: '桃園演算室', desc: '以數據轉譯能源與碳排，讓觀眾成為演算員，重新編碼城市的淨零未來。', visited: false, rating: 0, notes: '', tags: ['行動流'] },
      { id: 'A10', code: 'A10', name: '水之道', desc: '循著水之道，看見水如何在城市被留下、被使用，展現與水共生的城市之道。', visited: false, rating: 0, notes: '', tags: ['循環流'] },
      { id: 'A11', code: 'A11', name: '文化 Well-being.__ 生成中', desc: '以人為本，將多元世代的生活經驗轉譯為宜居的幸福風景，成為持續生成的城市生活命題。', visited: false, rating: 0, notes: '', tags: ['眾聲流'] },
      { id: 'A12', code: 'A12', name: '漸構桃園:造城進行式', desc: '匯聚青年設計、國際視野與城市行動，呈現青年世代以設計回應城市發展。', visited: false, rating: 0, notes: '', tags: ['新銳流'] },
      { id: 'A13', code: 'A13', name: '#桃園POV', desc: '匯聚全球與在地設計觀點，透過不同文化背景與創意思維的交會，重新描繪桃園城市意象。', visited: false, rating: 0, notes: '', tags: ['國際流'] },
      { id: 'A14', code: 'A14', name: '智匯生城市', desc: '將抽象的流動轉化為可被看見的城市形態，呈現多層系統運作建構的未來城市。', visited: false, rating: 0, notes: '', tags: ['智慧流'] },
      { id: 'B1', code: 'B1', name: '匯流城市・文化共生', desc: '打破界線，從信仰、飲食與服裝交織多元族群的生命經驗，呈現共生共榮的城市。', visited: false, rating: 0, notes: '', tags: ['文化流'] },
      { id: 'B2', code: 'B2', name: '青春匯萃', desc: '呈現桃園學生與青年設計的多元創作及國際交流成果，匯聚青春設計風景。', visited: false, rating: 0, notes: '', tags: ['青春流'] },
      { id: 'C2', code: 'C2', name: '一樣不一樣', desc: '兒童藝術特展，以「共融」為核心概念，邀請跨國藝術家與設計團隊展出。', visited: false, rating: 0, notes: '', tags: ['兒童特展'] },
      { id: 'C3', code: 'C3', name: '書寫的變奏與對話', desc: '書法與設計以文字造形為核心，在傳統與當代、手寫與科技之間展開對話。', visited: false, rating: 0, notes: '', tags: ['橫山美術館'] },
      { id: 'C4', code: 'C4', name: '原生力', desc: '引領觀眾循著族人的生活與記憶，看見原住民族文化在當代持續發光的樣貌。', visited: false, rating: 0, notes: '', tags: ['泰雅文化館'] },
      { id: 'C5', code: 'C5', name: '山城的客廳', desc: '透過三種當代的生活情境與風格，看見大溪工藝如何轉化新生、走進家庭。', visited: false, rating: 0, notes: '', tags: ['大溪木藝'] },
      { id: 'C1', code: 'C1', name: '✨ C1 (城市之鏡)', desc: '我們一起去看光雕展演吧！', visited: false, rating: 0, notes: '', tags: ['桃園市立美術館戶外空間'], isSurprise: true }
    ];

    const STORAGE_KEY = 'taiwandesignexpo_2026_exhibitions';
    const SURPRISE_TIME = new Date('2026-10-03T19:00:00+08:00').getTime();
    
    let exhibitions = [];
    let currentFilter = 'all';
    let toastTimer = null;

    // 🎨 判定展區顏色的輔助函數
    function getZoneColor(code) {
      if (code.startsWith('A')) return { bg: 'bg-rose-600', text: 'text-rose-600', border: 'border-rose-200', activeBg: 'bg-rose-50/40' }; // 官方洋紅
      if (code.startsWith('B')) return { bg: 'bg-blue-600', text: 'text-blue-600', border: 'border-blue-200', activeBg: 'bg-blue-50/40' }; // 官方藍
      if (code.startsWith('C')) return { bg: 'bg-rose-400', text: 'text-rose-400', border: 'border-rose-200', activeBg: 'bg-rose-50/40' }; // 官方淺桃
      return { bg: 'bg-slate-700', text: 'text-slate-700', border: 'border-slate-200', activeBg: 'bg-slate-50' };
    }

    function init() {
      localforage.config({ name: 'TaiwanDesignExpo2026', storeName: 'photos' });
      loadData();
      checkSurpriseTime();
      setInterval(checkSurpriseTime, 10000);
      setupEvents();
    }

    function checkSurpriseTime() {
      if (new Date().getTime() >= SURPRISE_TIME && !localStorage.getItem('c1Unlocked')) {
        localStorage.setItem('c1Unlocked', 'true');
        document.getElementById('surpriseModal').classList.remove('hidden');
        renderExhibitions();
      }
    }
    window.closeSurprise = () => { document.getElementById('surpriseModal').classList.add('hidden'); window.scrollTo({ top: 0, behavior: 'smooth' }); };

    function loadData() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) exhibitions = JSON.parse(stored);
      else { exhibitions = JSON.parse(JSON.stringify(BASE_EXHIBITIONS)); saveData(); }
      renderExhibitions();
    }

    function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(exhibitions)); updateProgress(); }

    function showToast(text) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = text;
      toast.classList.remove('opacity-0', 'translate-y-3', 'pointer-events-none');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.add('opacity-0', 'translate-y-3', 'pointer-events-none'), 1800);
    }

    function updateProgress() {
      const isUnlocked = new Date().getTime() >= SURPRISE_TIME;
      const visibleData = exhibitions.filter(e => !e.isSurprise || isUnlocked);
      const total = visibleData.length;
      const visited = visibleData.filter(e => e.visited).length;
      const percent = total > 0 ? Math.round((visited / total) * 100) : 0;
      document.getElementById('progressCount').textContent = visited;
      document.getElementById('totalCount').textContent = total;
      document.getElementById('progressPercent').textContent = `${percent}%`;
      document.getElementById('progressBar').style.width = `${percent}%`;
      document.getElementById('pillAllCount').textContent = total;
    }

    function renderExhibitions() {
      updateProgress();
      const listEl = document.getElementById('exhibitionList');
      const isUnlocked = new Date().getTime() >= SURPRISE_TIME;

      let filtered = exhibitions.filter(item => {
        if (item.isSurprise && !isUnlocked) return false;
        if (currentFilter === 'visited' && !item.visited) return false;
        if (currentFilter === 'pending' && item.visited) return false;
        return true;
      });

      filtered.sort((a, b) => (a.isSurprise ? -1 : b.isSurprise ? 1 : 0));

      if (filtered.length === 0) {
        listEl.innerHTML = '';
        document.getElementById('emptyState').classList.remove('hidden');
        return;
      }
      document.getElementById('emptyState').classList.add('hidden');

      listEl.innerHTML = filtered.map(item => {
        const isVisited = item.visited;
        const color = getZoneColor(item.code);
        
        let starsHtml = '';
        for (let i = 1; i <= 5; i++) {
          starsHtml += `<button type="button" onclick="handleSetRating('${item.id}', ${i})" class="p-1 text-base transition-transform active:scale-125 ${i <= item.rating ? 'text-amber-400' : 'text-slate-200'}"><i class="${i <= item.rating ? 'ph-fill ph-star' : 'ph-bold ph-star'}"></i></button>`;
        }
        
        // 未踩點時是低調的灰色，踩點後亮起專屬色彩
        const cardStyle = item.isSurprise ? 'surprise-card' : (isVisited ? `${color.border} shadow-sm ${color.activeBg}` : 'border-slate-200 shadow-2xs bg-white');
        const badgeStyle = item.isSurprise ? 'bg-gradient-to-r from-pink-400 to-rose-400 text-white' : (isVisited ? `${color.bg} text-white` : 'bg-slate-200 text-slate-500');
        const checkBtnStyle = isVisited ? `${color.bg} text-white shadow-md border-transparent` : 'bg-slate-50 text-slate-300 border-slate-200 hover:bg-slate-100';

        return `
          <article class="relative rounded-2xl border transition-all duration-300 ${cardStyle} p-4">
            <div class="flex items-start gap-3">
              <button onclick="handleToggleVisit('${item.id}')" class="mt-0.5 min-w-[2rem] h-8 rounded-xl flex items-center justify-center transition-all border-2 ${checkBtnStyle}">
                <i class="ph-bold ph-check text-lg"></i>
              </button>
              <div class="flex-1">
                <div class="flex items-center gap-2">
                  <!-- 為了避免 html2canvas 的跑版，這裡也統一改用絕對行高 inline-block -->
                  <span class="${badgeStyle} rounded text-[11px] font-bold font-mono tracking-wider inline-block text-center transition-colors" style="padding: 3px 6px; line-height: 1.2; vertical-align: middle;">${item.code}</span>
                  <h3 class="font-extrabold text-sm sm:text-base ${item.isSurprise ? 'text-pink-600' : 'text-slate-900'}">${item.name}</h3>
                </div>
                <p class="text-xs text-slate-500 mt-1.5 leading-relaxed">${item.desc}</p>
              </div>
            </div>

            <div class="mt-3.5 pt-3 border-t border-slate-100 bg-white/60 rounded-xl p-3 ${isVisited ? 'block' : 'hidden'}">
              <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-1.5"><span class="text-xs font-bold text-slate-600">評分:</span><div class="flex">${starsHtml}</div></div>
              </div>
              <textarea rows="2" placeholder="寫下專屬心得隨筆..." onchange="handleNoteInput('${item.id}', this.value)" class="w-full bg-white border border-slate-200 rounded-lg p-2.5 text-xs focus:ring-1 focus:ring-emerald-500 transition resize-none">${item.notes || ''}</textarea>
              
              <div class="mt-2 flex items-center gap-3">
                <label class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer flex items-center gap-1.5 transition shadow-sm">
                  <i class="ph-bold ph-image text-emerald-600"></i> 加入現場相片
                  <input type="file" accept="image/*" onchange="handleImageUpload(event, '${item.id}')">
                </label>
                <span id="uploadMsg_${item.id}" class="text-[10px] text-emerald-500 hidden font-bold animate-pulse">處理壓縮中...</span>
              </div>
              
              <div class="mt-2 relative hidden rounded-lg overflow-hidden border border-slate-200" id="imgContainer_${item.id}">
                <img id="preview_${item.id}" class="w-full max-h-40 object-cover" src="" alt="Photo">
                <button onclick="deleteImage('${item.id}')" class="absolute top-1 right-1 bg-slate-900/60 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs backdrop-blur-sm"><i class="ph-bold ph-x"></i></button>
              </div>
            </div>
          </article>
        `;
      }).join('');

      // 非同步讀取圖片
      filtered.forEach(item => {
        localforage.getItem(`img_${item.id}`).then(base64 => {
          if (base64) {
            const imgEl = document.getElementById(`preview_${item.id}`);
            const boxEl = document.getElementById(`imgContainer_${item.id}`);
            if(imgEl && boxEl) { imgEl.src = base64; boxEl.classList.remove('hidden'); }
          }
        });
      });
    }

    window.handleToggleVisit = (id) => {
      const idx = exhibitions.findIndex(e => e.id === id);
      exhibitions[idx].visited = !exhibitions[idx].visited;
      saveData(); renderExhibitions();
    };

    window.handleSetRating = (id, rating) => {
      const idx = exhibitions.findIndex(e => e.id === id);
      exhibitions[idx].rating = rating;
      if (rating > 0) exhibitions[idx].visited = true;
      saveData(); renderExhibitions(); showToast(`已評分 ★ ${rating}`);
    };

    window.handleNoteInput = (id, val) => {
      const idx = exhibitions.findIndex(e => e.id === id);
      exhibitions[idx].notes = val;
      saveData(); showToast('評語已自動儲存');
    };

    window.handleImageUpload = async (event, id) => {
      const file = event.target.files[0];
      if (!file) return;
      document.getElementById(`uploadMsg_${id}`).classList.remove('hidden');
      try {
        const base64Data = await compressImage(file);
        await localforage.setItem(`img_${id}`, base64Data);
        document.getElementById(`preview_${id}`).src = base64Data;
        document.getElementById(`imgContainer_${id}`).classList.remove('hidden');
      } catch (e) { alert("處理失敗！"); }
      finally {
        document.getElementById(`uploadMsg_${id}`).classList.add('hidden');
        event.target.value = '';
      }
    };

    window.deleteImage = (id) => {
      if(confirm("捨棄這張照片嗎？")) {
        localforage.removeItem(`img_${id}`).then(() => {
          document.getElementById(`imgContainer_${id}`).classList.add('hidden');
        });
      }
    };

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX = 1000;
            let { width, height } = img;
            if (width > height && width > MAX) { height *= MAX / width; width = MAX; }
            else if (height > MAX) { width *= MAX / height; height = MAX; }
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.8));
          };
          img.onerror = reject;
        };
      });
    }

    function setupEvents() {
      // 標籤篩選
      document.querySelectorAll('.filter-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-tab').forEach(b => {
            b.classList.remove('bg-slate-900', 'text-white');
            b.classList.add('bg-slate-100', 'text-slate-600');
          });
          btn.classList.add('bg-slate-900', 'text-white');
          currentFilter = btn.dataset.filter;
          renderExhibitions();
        });
      });

      // 產生圖文回憶錄
      const exportModal = document.getElementById('exportModal');
      const visualReport = document.getElementById('visualReport');
      
      document.getElementById('exportModalBtn').addEventListener('click', async () => {
        visualReport.innerHTML = '<div class="text-center text-slate-500 py-10 font-bold animate-pulse">翻閱相片與紀錄中...</div>';
        exportModal.classList.remove('hidden');

        const visited = exhibitions.filter(e => e.visited);
        if (visited.length === 0) {
          visualReport.innerHTML = '<div class="text-center text-slate-500 py-10 font-bold">尚未打卡！<br><span class="text-xs text-slate-400 mt-2 block">看完展區記得打勾、放上照片再來這裡喔！</span></div>';
          document.getElementById('downloadVisualReportBtn').classList.add('hidden');
          return;
        }

        document.getElementById('downloadVisualReportBtn').classList.remove('hidden');
        
        let html = `
          <div id="captureContainer" class="bg-white" style="width: 100%; max-width: 600px; margin: 0 auto; padding: 24px;">
            <div class="text-center mb-6">
              <h2 class="text-2xl font-extrabold text-slate-800 tracking-wider">2026 台灣設計展</h2>
              <!-- 👇 這裡的標題可以自己改成你們的名字喔！ -->
              <p class="text-sm text-emerald-600 font-bold mt-1">✨ 🧍‍♂️♥️🧍‍♀️ Fennel & Jason 的觀展回憶錄 ✨</p>
              <p class="text-xs text-slate-400 mt-2 font-mono">${new Date().toLocaleDateString('zh-TW')}</p>
              <div class="mt-3 w-12 h-1 bg-emerald-400 mx-auto rounded-full"></div>
            </div>
            <div class="space-y-6">
        `;

        for (const e of visited) {
          const stars = e.rating > 0 ? '★'.repeat(e.rating) : '';
          const color = getZoneColor(e.code);
          const reportBadgeColor = e.isSurprise ? 'background: linear-gradient(to right, #f472b6, #fb7185);' : `background-color: ${color.bg.replace('bg-', '')};`;

          let imgHtml = '';
          try {
            const base64 = await localforage.getItem(`img_${e.id}`);
            if (base64) {
              imgHtml = `<img src="${base64}" class="w-full h-auto rounded-xl mt-3 shadow-sm border border-slate-200" style="display: block;">`;
            }
          } catch(err) {}

          // 核心修復區：完全拔除 Flexbox，改用 inline-block 與絕對行高，終結 html2canvas 跑版惡夢
          html += `
            <div class="border-b border-slate-100 pb-6 last:border-0 last:pb-0">
              <div style="margin-bottom: 6px;">
                <span class="${color.bg} text-white rounded font-mono font-bold text-center" style="display: inline-block; padding: 4px 6px; font-size: 11px; line-height: 1; vertical-align: middle;">${e.code}</span>
                <h3 class="font-bold text-slate-800 text-base" style="display: inline-block; margin-left: 6px; vertical-align: middle;">${e.name}</h3>
              </div>
              ${stars ? `<div class="text-amber-400 text-sm mb-2 tracking-widest">${stars}</div>` : ''}
              ${e.notes ? `<div class="text-sm text-slate-700 bg-slate-50 p-3 rounded-lg leading-relaxed border border-slate-200 mt-2">${e.notes}</div>` : ''}
              ${imgHtml}
            </div>
          `;
        }
        
        html += `</div><div class="text-center mt-8 text-[10px] text-slate-400 font-mono">Created by 我們的觀展小幫手</div></div>`;
        visualReport.innerHTML = html;
      });

      document.getElementById('closeExportModal').onclick = document.getElementById('closeExportModalBtn2').onclick = () => exportModal.classList.add('hidden');
      
      document.getElementById('downloadVisualReportBtn').addEventListener('click', async () => {
        const loadingEl = document.getElementById('captureLoading');
        loadingEl.classList.remove('hidden');

        try {
          const captureContainer = document.getElementById('captureContainer');
          const canvas = await html2canvas(captureContainer, { 
            scale: 2, 
            useCORS: true, 
            backgroundColor: '#ffffff',
            logging: false
          });
          
          const imgData = canvas.toDataURL('image/jpeg', 0.85); 
          
          document.getElementById('finalGeneratedImage').src = imgData;
          document.getElementById('finalImageModal').classList.remove('hidden');
          exportModal.classList.add('hidden');
        } catch (error) {
          alert('產生圖檔失敗，請確認照片格式是否正確！');
        } finally {
          loadingEl.classList.add('hidden');
        }
      });

      const confirmModal = document.getElementById('confirmModal');
      document.getElementById('resetAllDataBtn').onclick = () => confirmModal.classList.remove('hidden');
      document.getElementById('cancelResetBtn').onclick = () => confirmModal.classList.add('hidden');
      document.getElementById('confirmResetBtn').onclick = () => {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem('c1Unlocked');
        localforage.clear().then(() => location.reload());
      };
    }

    init();
  </script>
</body>
</html>
