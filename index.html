<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 台灣設計展 - 專屬觀展護照</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <style>
        body { background-color: #f8fafc; font-family: 'PingFang TC', 'Helvetica Neue', sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
        .star { font-size: 1.5rem; color: #cbd5e1; cursor: pointer; transition: color 0.2s; }
        .star.active { color: #fbbf24; }
        @keyframes glow { 0% { box-shadow: 0 0 5px #f472b6; } 50% { box-shadow: 0 0 20px #f472b6, 0 0 10px #f472b6 inset; } 100% { box-shadow: 0 0 5px #f472b6; } }
        .surprise-card { border: 2px solid #f472b6; animation: glow 2s infinite; background: linear-gradient(to right, #fff, #fff0f6); }
        input[type="file"] { display: none; }
    </style>
</head>
<body class="pb-24">

    <!-- 頂部進度條 -->
    <div class="sticky top-0 z-40 bg-white/90 backdrop-blur-md shadow-sm px-4 py-3">
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-xl font-bold text-gray-800">✨ Fennel & Jason's 設計展觀展集章</h1>
            <button onclick="generateReport()" class="bg-gray-800 text-white px-3 py-1.5 rounded-full text-sm font-medium active:scale-95 transition-transform">
                產出戰報
            </button>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2.5">
            <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
        </div>
        <p id="progressText" class="text-xs text-gray-500 mt-1 text-right">已完成: 0 / 18</p>
    </div>

    <!-- 展區列表 -->
    <div id="zonesContainer" class="p-4 space-y-4"></div>

    <!-- 一鍵清除資料按鈕 -->
    <div class="mt-8 mb-12 text-center">
        <button onclick="clearAllData()" class="text-xs text-gray-400 underline hover:text-red-500 transition-colors px-4 py-2">
            活動結束：清除所有本機照片與紀錄
        </button>
    </div>

    <!-- 驚喜解鎖彈出視窗 -->
    <div id="surpriseModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm text-center shadow-2xl transform scale-100 transition-all">
            <div class="text-6xl mb-4 animate-bounce">🎇</div>
            <h3 class="text-2xl font-bold text-pink-600 mb-2">Surprise! 叮咚！</h3>
            <p class="text-gray-700 mb-6 font-medium leading-relaxed">
                晚上好！有一個特別為妳準備的隱藏驚喜展區已經解鎖囉！<br>牽著我的手，一起去看光秀吧！
            </p>
            <button onclick="closeModal()" class="w-full bg-pink-500 text-white rounded-xl py-3 font-bold text-lg active:scale-95 transition-transform shadow-lg shadow-pink-500/30">
                去看看 ✨
            </button>
        </div>
    </div>

    <script>
        const allZones = [
            ...Array.from({length: 14}, (_, i) => ({ id: `A${i+1}`, name: `A${i+1} 展區`, loc: '青埔' })),
            { id: 'B1', name: 'B1 展區', loc: '中壢' },
            { id: 'B2', name: 'B2 展區', loc: '中壢' },
            { id: 'C3', name: 'C3 橫山美術館', loc: '橫山' },
            { id: 'C1', name: '✨ C1 光秀 (專屬驚喜)', loc: '📍 特別區', desc: '這個展區是特別為妳解鎖的，我們一起去！', isSurprise: true }
        ];

        // 驚喜時間 (記得測試完改回 2026-10-03T19:00:00+08:00)
        const SURPRISE_TIME = new Date('2026-10-03T19:00:00+08:00').getTime();
        let records = JSON.parse(localStorage.getItem('expoRecords')) || {};

        function init() {
            localforage.config({ name: 'TaiwanDesignExpo', storeName: 'photos' });
            checkSurpriseTime();
            renderZones();
            setInterval(checkSurpriseTime, 10000);
        }

        function checkSurpriseTime() {
            const now = new Date().getTime();
            if (now >= SURPRISE_TIME && !localStorage.getItem('surpriseUnlocked')) {
                localStorage.setItem('surpriseUnlocked', 'true');
                document.getElementById('surpriseModal').classList.remove('hidden');
                renderZones();
            }
        }

        function closeModal() {
            document.getElementById('surpriseModal').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderZones() {
            const container = document.getElementById('zonesContainer');
            container.innerHTML = '';
            
            let completed = 0;
            const now = new Date().getTime();
            const isUnlocked = now >= SURPRISE_TIME;
            
            let displayZones = allZones.filter(z => !z.isSurprise || isUnlocked);
            displayZones.sort((a, b) => (a.isSurprise ? -1 : b.isSurprise ? 1 : 0));

            displayZones.forEach(zone => {
                const data = records[zone.id] || { checked: false, rating: 0, comment: '' };
                if (data.checked) completed++;
                const isSurpriseCard = zone.isSurprise ? 'surprise-card' : 'border-gray-200';
                
                let starsHTML = '';
                for (let i = 1; i <= 5; i++) {
                    starsHTML += `<span class="star ${i <= data.rating ? 'active' : ''}" onclick="setRating('${zone.id}', ${i})">★</span>`;
                }

                const card = document.createElement('div');
                card.className = `bg-white rounded-2xl p-4 shadow-sm border ${isSurpriseCard} transition-all duration-300`;
                card.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div class="flex-1 flex gap-3">
                            <button onclick="toggleCheck('${zone.id}')" class="mt-1 min-w-[2rem] h-8 rounded-full border-2 flex items-center justify-center transition-colors ${data.checked ? 'bg-green-500 border-green-500 text-white' : 'border-gray-300 text-transparent'}">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            </button>
                            <div class="w-full">
                                <h2 class="text-lg font-bold text-gray-800 ${zone.isSurprise ? 'text-pink-600' : ''}">${zone.name}</h2>
                                <span class="inline-block bg-gray-100 text-gray-600 text-xs px-2 py-1 rounded mt-1">${zone.loc}</span>
                                ${zone.desc ? `<p class="text-sm text-pink-500 font-medium mt-1">${zone.desc}</p>` : ''}
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-4 pt-3 border-t border-gray-50 border-dashed ${data.checked ? 'block' : 'hidden'}">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-sm text-gray-500 font-medium">評分：</span>
                            <div class="flex gap-1">${starsHTML}</div>
                        </div>
                        <textarea 
                            onchange="saveComment('${zone.id}', this.value)"
                            placeholder="寫下心得..." 
                            class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none h-20 mb-3"
                        >${data.comment}</textarea>
                        
                        <div class="flex items-center gap-3">
                            <label class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-lg text-sm cursor-pointer flex items-center gap-2 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                加入照片
                                <input type="file" accept="image/*" onchange="handleImageUpload(event, '${zone.id}')">
                            </label>
                            <span id="uploadMsg_${zone.id}" class="text-xs text-blue-500 hidden">處理中...</span>
                        </div>
                        <div class="mt-3 relative hidden" id="imgContainer_${zone.id}">
                            <img id="preview_${zone.id}" class="w-full max-h-48 object-cover rounded-xl border border-gray-200" src="" alt="預覽圖">
                            <button onclick="deleteImage('${zone.id}')" class="absolute top-2 right-2 bg-red-500/80 text-white w-7 h-7 rounded-full flex items-center justify-center text-sm backdrop-blur-sm">✕</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);

                localforage.getItem(`img_${zone.id}`).then(imgBase64 => {
                    if (imgBase64) {
                        document.getElementById(`preview_${zone.id}`).src = imgBase64;
                        document.getElementById(`imgContainer_${zone.id}`).classList.remove('hidden');
                    }
                }).catch(err => console.log('讀取圖片失敗', err));
            });

            document.getElementById('progressBar').style.width = `${(completed / displayZones.length) * 100}%`;
            document.getElementById('progressText').innerText = `已攻略: ${completed} / ${displayZones.length} 區`;
        }

        function toggleCheck(id) {
            if (!records[id]) records[id] = { checked: false, rating: 0, comment: '' };
            records[id].checked = !records[id].checked;
            saveData();
            renderZones();
        }

        function setRating(id, rating) {
            if (!records[id]) records[id] = { checked: true, rating: 0, comment: '' };
            records[id].rating = rating;
            saveData();
            renderZones();
        }

        function saveComment(id, text) {
            if (!records[id]) records[id] = { checked: true, rating: 0, comment: '' };
            records[id].comment = text;
            saveData();
        }

        function saveData() {
            localStorage.setItem('expoRecords', JSON.stringify(records));
        }

        async function handleImageUpload(event, zoneId) {
            const file = event.target.files[0];
            if (!file) return;

            const msgEl = document.getElementById(`uploadMsg_${zoneId}`);
            msgEl.classList.remove('hidden');

            try {
                const base64Data = await compressImage(file);
                await localforage.setItem(`img_${zoneId}`, base64Data);
                document.getElementById(`preview_${zoneId}`).src = base64Data;
                document.getElementById(`imgContainer_${zoneId}`).classList.remove('hidden');
            } catch (error) {
                alert("照片處理失敗，請換一張試試！");
            } finally {
                msgEl.classList.add('hidden');
                event.target.value = ''; 
            }
        }

        function deleteImage(zoneId) {
            if(confirm("確定要刪除這張照片嗎？")) {
                localforage.removeItem(`img_${zoneId}`).then(() => {
                    document.getElementById(`imgContainer_${zoneId}`).classList.add('hidden');
                    document.getElementById(`preview_${zoneId}`).src = '';
                });
            }
        }

        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1000;
                        const MAX_HEIGHT = 1000;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7)); 
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        function generateReport() {
            let report = "【2026 台灣設計展 - 我們的觀展戰報】\n\n";
            let hasChecked = false;
            allZones.forEach(z => {
                const data = records[z.id];
                if (data && data.checked) {
                    hasChecked = true;
                    report += `📍 ${z.name}\n`;
                    if (data.rating > 0) report += `評分: ${'★'.repeat(data.rating)}\n`;
                    if (data.comment) report += `心得: ${data.comment}\n`;
                    report += `\n`;
                }
            });
            if (!hasChecked) { alert("還沒有踩點紀錄喔！快去逛逛吧！"); return; }
            navigator.clipboard.writeText(report).then(() => {
                alert("✨ 戰報已自動複製！快去貼給朋友或發 IG 限動吧！\n\n預覽：\n" + report);
            });
        }

        // --- 清除本機所有資料的功能 ---
        function clearAllData() {
            if(confirm("確定要清除所有打卡紀錄與照片嗎？\n(這會釋放手機空間，但紀錄無法復原喔！記得先產出戰報)")) {
                // 1. 清除文字與打卡紀錄
                localStorage.removeItem('expoRecords');
                localStorage.removeItem('surpriseUnlocked');
                
                // 2. 清除所有儲存的照片
                localforage.clear().then(function() {
                    alert("✅ 所有紀錄與照片已成功清除！");
                    location.reload(); // 重新載入網頁恢復初始狀態
                }).catch(function(err) {
                    alert('清除照片失敗，請再試一次');
                    console.log('Error:', err);
                });
            }
        }

        init();
    </script>
</body>
</html>
